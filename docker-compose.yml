# =============================================================================
# Rowvane — Optional Docker Compose PostgreSQL Environment
# Run "docker compose up -d" to launch a local, isolated PostgreSQL 16 container.
# =============================================================================

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: rowvane_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rowvane
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rowvane"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
